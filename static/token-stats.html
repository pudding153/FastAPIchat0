  <div class="restore-section">
    <h2>ログから復元</h2>
    <div class="restore-actions" style="margin-top:0;margin-bottom:12px;">
      <label>
        <input type="checkbox" id="reset-current" checked>
        当月データをログの内容で上書きする
      </label>
      <button onclick="restoreAuto()">ログから自動復元</button>
    </div>
    <textarea id="restore-logs" placeholder="（任意）手動で貼る場合はここに Render のログを貼り付け"></textarea>
    <div class="restore-actions">
      <button onclick="restoreFromLogs()">貼り付けログで復元</button>
    </div>
    <div class="restore-msg" id="restore-msg"></div>
  </div>
