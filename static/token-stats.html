<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トークン使用量</title>
<style>
  :root {
    --bg: #fafafa;
    --card-bg: #ffffff;
    --border: #e2e2e2;
    --text-main: #1a1a1a;
    --text-sub: #767676;
    --accent: #2f6f4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    background: var(--bg);
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    color: var(--text-main);
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .updated {
    font-size: 13px;
    color: var(--text-sub);
    margin-bottom: 20px;
  }
  .period-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .period-bar select {
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    font-size: 14px;
    color: var(--text-main);
  }
  .badge {
    font-size: 12px;
    background: #e8f5ee;
    color: var(--accent);
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 600;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 16px;
  }
  .card .label {
    font-size: 13px;
    color: var(--text-sub);
    margin-bottom: 8px;
  }
  .card .value {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .card.accent .value { color: var(--accent); }
  .detail {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 14px;
  }
  .detail-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .k { color: var(--text-sub); }
  .detail-row .v { font-weight: 600; }
  .error {
    color: #b3261e;
    font-size: 14px;
    margin-top: 16px;
  }
  button {
    margin-top: 20px;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    cursor: pointer;
    font-size: 13px;
    color: var(--text-main);
  }
  button:hover { background: #f0f0f0; }
  .note {
    font-size: 12px;
    color: var(--text-sub);
    margin-top: 12px;
    line-height: 1.5;
  }
  .history-section {
    margin-top: 36px;
  }
  .history-section h2 {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 12px;
  }
  .history-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 13px;
  }
  .history-table th,
  .history-table td {
    padding: 10px 12px;
    text-align: right;
    border-bottom: 1px solid var(--border);
  }
  .history-table th:first-child,
  .history-table td:first-child {
    text-align: left;
  }
  .history-table th {
    background: #f5f5f5;
    color: var(--text-sub);
    font-weight: 500;
  }
  .history-table tr:last-child td {
    border-bottom: none;
  }
  .history-table tr:hover {
    background: #fafafa;
  }
  .empty {
    text-align: center;
    color: var(--text-sub);
    padding: 24px;
    font-size: 14px;
  }
  .restore-section {
    margin-top: 36px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .restore-section h2 {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 12px;
  }
  .restore-section textarea {
    width: 100%;
    min-height: 140px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    resize: vertical;
    color: var(--text-main);
    background: #fafafa;
  }
  .restore-actions {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .restore-actions label {
    font-size: 13px;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .restore-msg {
    font-size: 13px;
    margin-top: 10px;
    color: var(--accent);
  }
  .restore-msg.err {
    color: #b3261e;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>トークン使用量</h1>
  <div class="updated" id="updated">読み込み中...</div>

  <div class="period-bar">
    <select id="month-select" onchange="onMonthChange()">
      <option value="current">当月</option>
    </select>
    <span class="badge" id="period-badge">当月</span>
  </div>

  <div class="grid">
    <div class="card">
      <div class="label">入力トークン</div>
      <div class="value" id="input-val">–</div>
    </div>
    <div class="card">
      <div class="label">出力トークン</div>
      <div class="value" id="output-val">–</div>
    </div>
    <div class="card accent">
      <div class="label">リクエスト数</div>
      <div class="value" id="request-val">–</div>
    </div>
  </div>

  <div class="detail">
    <div class="detail-row">
      <span class="k">合計トークン(入力+出力)</span>
      <span class="v" id="total-val">–</span>
    </div>
    <div class="detail-row">
      <span class="k">1リクエストあたり平均 入力</span>
      <span class="v" id="avg-input-val">–</span>
    </div>
    <div class="detail-row">
      <span class="k">1リクエストあたり平均 出力</span>
      <span class="v" id="avg-output-val">–</span>
    </div>
    <div class="detail-row">
      <span class="k">合計金額（円）</span>
      <span class="v" id="cost-val">–</span>
    </div>
  </div>

  <div class="note">
    料金：入力 $0.25 / 100万トークン、出力 $1.50 / 100万トークン<br>
    為替：1 USD ≒ 156.3 円 で換算（参考値）<br>
    ※ 表示は毎月1日に自動リセットされます。過去月の履歴は下部に保存されます。
  </div>

  <div class="error" id="error" style="display:none;"></div>
  <button onclick="loadStats()">更新</button>

  <div class="history-section">
    <h2>月別履歴</h2>
    <table class="history-table" id="history-table">
      <thead>
        <tr>
          <th>月</th>
          <th>リクエスト</th>
          <th>入力</th>
          <th>出力</th>
          <th>合計金額</th>
        </tr>
      </thead>
      <tbody id="history-body">
        <tr><td colspan="5" class="empty">読み込み中...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="restore-section">
    <h2>ログから復元</h2>
    <textarea id="restore-logs" placeholder="RenderのLogsから [TOKEN USAGE] の行をコピーして貼り付け"></textarea>
    <div class="restore-actions">
      <label>
        <input type="checkbox" id="reset-current">
        当月データをログの内容で上書きする
      </label>
      <button onclick="restoreFromLogs()">復元する</button>
    </div>
    <div class="restore-msg" id="restore-msg"></div>
  </div>
</div>

<script>
  const STATS_URL = "/api/token-stats";
  const HISTORY_URL = "/api/token-stats/history";
  const RESTORE_URL = "/api/token-stats/restore";

  const INPUT_PRICE_PER_M = 0.25;
  const OUTPUT_PRICE_PER_M = 1.50;
  const USD_TO_JPY = 156.3;

  let currentData = null;
  let historyData = [];

  function fmt(n) {
    return Number(n).toLocaleString("ja-JP");
  }

  function fmtYen(n) {
    if (n < 1) return "¥" + n.toFixed(1);
    return "¥" + Math.round(n).toLocaleString("ja-JP");
  }

  function calcCost(input, output) {
    const costUsd = (input / 1_000_000) * INPUT_PRICE_PER_M + (output / 1_000_000) * OUTPUT_PRICE_PER_M;
    return costUsd * USD_TO_JPY;
  }

  function formatMonthLabel(key) {
    if (key === "current") return "当月";
    const [y, m] = key.split("-");
    return `${y}年${parseInt(m)}月`;
  }

  function renderStats(data) {
    const input = data.total_input || 0;
    const output = data.total_output || 0;
    const count = data.request_count || 0;

    document.getElementById("input-val").textContent = fmt(input);
    document.getElementById("output-val").textContent = fmt(output);
    document.getElementById("request-val").textContent = fmt(count);
    document.getElementById("total-val").textContent = fmt(input + output);
    document.getElementById("avg-input-val").textContent = count > 0 ? fmt(Math.round(input / count)) : "–";
    document.getElementById("avg-output-val").textContent = count > 0 ? fmt(Math.round(output / count)) : "–";
    document.getElementById("cost-val").textContent = fmtYen(calcCost(input, output));
  }

  function renderHistory() {
    const tbody = document.getElementById("history-body");
    const select = document.getElementById("month-select");

    select.innerHTML = `<option value="current">当月</option>`;
    historyData.forEach(item => {
      const opt = document.createElement("option");
      opt.value = item.month;
      opt.textContent = formatMonthLabel(item.month);
      select.appendChild(opt);
    });

    if (historyData.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty">履歴がまだありません</td></tr>`;
      return;
    }

    tbody.innerHTML = historyData.map(item => {
      const cost = calcCost(item.total_input || 0, item.total_output || 0);
      return `
        <tr>
          <td>${formatMonthLabel(item.month)}</td>
          <td>${fmt(item.request_count || 0)}</td>
          <td>${fmt(item.total_input || 0)}</td>
          <td>${fmt(item.total_output || 0)}</td>
          <td>${fmtYen(cost)}</td>
        </tr>
      `;
    }).join("");
  }

  async function loadStats() {
    const errorEl = document.getElementById("error");
    errorEl.style.display = "none";

    try {
      const res = await fetch(STATS_URL);
      if (!res.ok) throw new Error("HTTP " + res.status);
      currentData = await res.json();

      try {
        const hRes = await fetch(HISTORY_URL);
        if (hRes.ok) {
          historyData = await hRes.json();
          historyData.sort((a, b) => b.month.localeCompare(a.month));
        }
      } catch (_) {
        historyData = [];
      }

      renderHistory();
      onMonthChange();

      document.getElementById("updated").textContent =
        "最終更新: " + new Date().toLocaleString("ja-JP");
    } catch (e) {
      errorEl.style.display = "block";
      errorEl.textContent = "データの取得に失敗しました: " + e.message;
    }
  }

  function onMonthChange() {
    const select = document.getElementById("month-select");
    const value = select.value;
    const badge = document.getElementById("period-badge");

    if (value === "current") {
      badge.textContent = "当月";
      if (currentData) renderStats(currentData);
    } else {
      badge.textContent = formatMonthLabel(value);
      const item = historyData.find(d => d.month === value);
      if (item) renderStats(item);
    }
  }

  async function restoreFromLogs() {
    const msgEl = document.getElementById("restore-msg");
    const logs = document.getElementById("restore-logs").value.trim();
    const resetCurrent = document.getElementById("reset-current").checked;

    msgEl.className = "restore-msg";
    msgEl.textContent = "";

    if (!logs) {
      msgEl.className = "restore-msg err";
      msgEl.textContent = "ログを貼り付けてください";
      return;
    }

    try {
      const res = await fetch(RESTORE_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ logs, reset_current: resetCurrent })
      });
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.detail || ("HTTP " + res.status));
      }
      msgEl.textContent = `復元完了: ${data.matched_lines}行 / 月 ${data.restored_months.join(", ")}`;
      await loadStats();
    } catch (e) {
      msgEl.className = "restore-msg err";
      msgEl.textContent = "復元に失敗しました: " + e.message;
    }
  }

  loadStats();
  setInterval(() => {
    if (document.getElementById("month-select").value === "current") {
      loadStats();
    }
  }, 10000);
</script>
</body>
</html>
